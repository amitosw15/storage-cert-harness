apiVersion: v1
kind: Pod
metadata:
  name: {{ .NAME | quote }}
  namespace: {{ .NAMESPACE | quote }}
  {{ if .ANNOTATIONS }}
  annotations: {{ .ANNOTATIONS | toJson }}
  {{ end }}
  labels:
    app: kubevirt-perf-test
    managed-by: storage-cert-harness
spec:
  {{ if .AVOID_NODES }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: {{ .AVOID_NODES | toJson }}
  {{ end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ssh-client
      image: quay.io/virtarraycert/ssh-helper@sha256:369697c3002c1971bb608189d343fe9ea4989d2b66fde1bd1b64e924416533d1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      command: ["/bin/bash", "-c", "exec sleep infinity"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/sshhelper
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
  volumes:
    - name: tmp
      emptyDir: {}
    - name: home
      emptyDir: {}
  restartPolicy: Always
