# Script-centric CI (ECOPROJECT-5274 / ADR-0010).
# Runner tag itup-alm-x86 matches csi-certification-kb (CEE ITUP ALM).
# Local default container engine is podman; these jobs override to buildah.
#
# Image and tool pins live in ci/config/images.env. This include is the YAML
# projection (GitLab cannot source dotenv for `image:`).

include:
  - local: ci/config/images.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

stages:
  - lint
  - test
  - build
  - smoke
  - image

variables:
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"
  # BUILD_IMAGE, TRIVY_IMAGE, DIVE_IMAGE, QUAY_IMAGE, tool versions: ci/config/images.yml

default:
  tags:
    - itup-alm-x86
  artifacts:
    when: on_failure
    # *.log only — logs/README.md is tracked in git and is not a job log.
    paths:
      - logs/*.log
    expire_in: 1 week

.golang:
  image: "${GO_IMAGE}"
  tags: [itup-alm-x86]
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

.buildah:
  image: "${BUILDAH_IMAGE}"
  tags: [itup-alm-x86]
  variables:
    STORAGE_DRIVER: vfs
    CONTAINER_ENGINE: buildah
  before_script:
    - command -v git >/dev/null 2>&1 || dnf install -y git-core

lint-yaml:
  stage: lint
  tags: [itup-alm-x86]
  image: "${YAML_LINT_IMAGE}"
  before_script:
    - pip install --quiet yamllint
  script:
    - ./ci/scripts/lint-yaml.sh

lint-md:
  stage: lint
  tags: [itup-alm-x86]
  image: "${MD_LINT_IMAGE}"
  before_script:
    - npm install --global markdownlint-cli2
  script:
    - ./ci/scripts/lint-md.sh

lint-go:
  stage: lint
  tags: [itup-alm-x86]
  extends: .golang
  # GitHub release binary (pin: GOLANGCI_LINT_VERSION in ci/config/images.env). Do not
  # pull docker.io/golangci/golangci-lint — CEE runners hit Hub rate limits.
  # Install into GOPATH/bin: go-toolset runs as non-root (no /usr/local/bin).
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      set -euo pipefail
      ver="${GOLANGCI_LINT_VERSION}"
      rel="golangci-lint-${ver#v}-linux-amd64"
      dest="$(go env GOPATH)/bin"
      mkdir -p "${dest}"
      curl -sSfL \
        "https://github.com/golangci/golangci-lint/releases/download/${ver}/${rel}.tar.gz" \
        | tar xz -C "${dest}" --strip-components=1 "${rel}/golangci-lint"
      export PATH="${dest}:${PATH}"
  script:
    - ./ci/scripts/lint-go.sh

unittest:
  stage: test
  tags: [itup-alm-x86]
  extends: .golang
  script:
    - ./ci/scripts/unittest.sh

secret-scan:
  stage: test
  tags: [itup-alm-x86]
  extends: .golang
  script:
    - ./ci/scripts/secret-scan.sh

supply-chain:
  stage: test
  tags: [itup-alm-x86]
  extends: .golang
  # Temporary: job is allowed to fail (ECOPROJECT-5419). Make it gating after
  # govulncheck GO-2026-4602 is fixed (go1.26.1+).
  allow_failure: true
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - mkdir -p logs
    - GOPROXY=https://proxy.golang.org,direct GOFLAGS= go install golang.org/x/vuln/cmd/govulncheck@latest
    # gosec: direct release tarball. go install OOM-kills CEE pods; install.sh resolves the tag via the rate-limited GitHub API.
    - |
      mkdir -p "$(go env GOPATH)/bin"
      curl -sSfL "https://github.com/securego/gosec/releases/download/${GOSEC_VERSION}/gosec_${GOSEC_VERSION#v}_linux_amd64.tar.gz" \
        | tar xz -C "$(go env GOPATH)/bin" gosec
    # go-toolset is non-root; do not install into /usr/local/bin.
    - |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sh -s -- -b "$(go env GOPATH)/bin" "${TRIVY_VERSION}"
    - export PATH="$(go env GOPATH)/bin:$PATH"
  script:
    - ./ci/scripts/supply-chain.sh

build:
  stage: build
  tags: [itup-alm-x86]
  extends: .golang
  variables:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: "0"
  script:
    - ./ci/scripts/build.sh
  artifacts:
    when: on_success
    paths: [bin/harness, logs/*.log]
    expire_in: 1 week

replay-smoke:
  stage: smoke
  tags: [itup-alm-x86]
  extends: .golang
  # Skip unless someone plays it. allow_failure so the image stage is not blocked.
  when: manual
  allow_failure: true
  script:
    - ./ci/scripts/replay-smoke.sh

image-build:
  stage: image
  extends: .buildah
  needs:
    - job: build
      artifacts: true
  script:
    - ./ci/scripts/image-build.sh
  artifacts:
    when: always
    paths:
      - dist/harness-image.tar
      - logs/*.log
    expire_in: 1 day

image-scan-trivy:
  stage: image
  tags: [itup-alm-x86]
  extends: .golang
  allow_failure: true
  needs:
    - job: image-build
      artifacts: true
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sh -s -- -b "$(go env GOPATH)/bin" "${TRIVY_VERSION}"
    - export PATH="$(go env GOPATH)/bin:$PATH"
  script:
    - ./ci/scripts/image-scan-trivy.sh
  artifacts:
    when: always
    paths:
      - logs/*.log
      - dist/trivy-report.json
      - dist/trivy-report.txt
    expire_in: 1 week

image-scan-dive:
  stage: image
  tags: [itup-alm-x86]
  extends: .golang
  allow_failure: true
  needs:
    - job: image-build
      artifacts: true
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      set -euo pipefail
      source ci/scripts/images.sh
      ver="${DIVE_VERSION#v}"
      curl -sSfL "https://github.com/wagoodman/dive/releases/download/${DIVE_VERSION}/dive_${ver}_linux_amd64.tar.gz" | tar xz
      install -m 0755 dive "$(go env GOPATH)/bin/dive"
    - export PATH="$(go env GOPATH)/bin:$PATH"
  script:
    - ./ci/scripts/image-scan-dive.sh
  artifacts:
    when: always
    paths:
      - logs/*.log
      - dist/dive-report.txt
    expire_in: 1 week

image-push:
  stage: image
  extends: .buildah
  variables:
    STORAGE_DRIVER: vfs
    CONTAINER_ENGINE: buildah
    PUSH: "1"
  needs:
    - job: image-scan-trivy
    - job: image-scan-dive
    - job: image-build
      artifacts: true
  script:
    - ./ci/scripts/image-push.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true

version-bump:
  stage: image
  tags: [itup-alm-x86]
  extends: .golang
  needs:
    - job: image-build
    - job: image-scan-trivy
    - job: image-scan-dive
  script:
    - ./ci/scripts/advance-version.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
