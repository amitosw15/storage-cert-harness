name: CI Build

on:
  workflow_call:

permissions:
  contents: read

env:
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./ci/scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: harness-binary
          path: bin/harness
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-build
          path: logs/*.log
          if-no-files-found: ignore
