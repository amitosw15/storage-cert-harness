name: CI Tests

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

env:
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./ci/scripts/unittest.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-unittest
          path: logs/*.log
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./ci/scripts/secret-scan.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-secret-scan
          path: logs/*.log
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOFLAGS: ""
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Direct tarball: gosec's install.sh resolves the tag via the unauthenticated GitHub API and fails on rate limit.
      - name: Install gosec
        run: |
          set -euo pipefail
          source ci/scripts/images.sh
          ver="${GOSEC_VERSION#v}"
          bindir="$(go env GOPATH)/bin"
          mkdir -p "${bindir}"
          curl -sSfL "https://github.com/securego/gosec/releases/download/${GOSEC_VERSION}/gosec_${ver}_linux_amd64.tar.gz" \
            | tar xz -C "${bindir}" gosec
      # Avoid the upstream installer's get.trivy.dev dependency, which fails DNS resolution.
      - name: Install Trivy
        run: |
          set -euo pipefail
          source ci/scripts/images.sh
          ver="${TRIVY_VERSION#v}"
          archive="trivy_${ver}_Linux-64bit.tar.gz"
          checksums="trivy_${ver}_checksums.txt"
          release="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          bindir="$(go env GOPATH)/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL --retry 3 "${release}/${archive}" -o "${tmp}/${archive}"
          curl -fsSL --retry 3 "${release}/${checksums}" -o "${tmp}/${checksums}"
          (cd "${tmp}" && awk -v archive="${archive}" '$2 == archive { print }' "${checksums}" | sha256sum --check --strict)
          mkdir -p "${bindir}"
          tar xzf "${tmp}/${archive}" -C "${bindir}" trivy
          "${bindir}/trivy" --version
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./ci/scripts/supply-chain.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-supply-chain
          path: logs/*.log
          if-no-files-found: ignore
