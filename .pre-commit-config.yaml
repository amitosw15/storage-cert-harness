repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint (ci/scripts/lint-yaml.sh)
        language: script
        entry: ./ci/scripts/lint-yaml.sh
        files: \.(yml|yaml)$
        pass_filenames: false
      - id: lint-md
        name: markdownlint (ci/scripts/lint-md.sh)
        language: script
        entry: ./ci/scripts/lint-md.sh
        files: \.md$
        exclude: ^(vendor/|logs/|okf/|skills/|AGENTS\.md|CLAUDE\.md)
        pass_filenames: false
      - id: lint-go
        name: golangci-lint (ci/scripts/lint-go.sh)
        language: script
        entry: ./ci/scripts/lint-go.sh
        files: '\.go$|ci/config/golangci\.yml$|^go\.(mod|sum)$'
        exclude: ^vendor/
        pass_filenames: false
      - id: secret-scan
        name: secret-scan (ci/scripts/secret-scan.sh)
        language: script
        entry: ./ci/scripts/secret-scan.sh
        pass_filenames: false
        # yamllint disable-line rule:line-length
        files: '(\.vscode/|\.cursor/|\.devcontainer/|\.code-workspace|(^|/)\.env|ci/scripts/secret-scan|report\.(json|md))'
      - id: unittest
        name: unittest (ci/scripts/unittest.sh)
        language: system
        entry: bash
        args: [-c, 'GOTOOLCHAIN=auto GOPROXY=https://proxy.golang.org,direct ./ci/scripts/unittest.sh']
        files: '\.go$|^go\.(mod|sum)$'
        exclude: ^vendor/
        pass_filenames: false
      - id: supply-chain
        name: supply-chain (ci/scripts/supply-chain.sh)
        language: system
        entry: bash
        args: [-c, 'GOTOOLCHAIN=auto GOPROXY=https://proxy.golang.org,direct ./ci/scripts/supply-chain.sh']
        files: '(\.go$|^go\.(mod|sum)$|^vendor/|^Containerfile$)'
        pass_filenames: false
      - id: version-files-locked
        name: version files locked
        language: script
        entry: ./ci/scripts/version-lock-check.sh
        files: '^(VERSION|NEXT-VERSION|IMAGE-VERSION|NEXT-IMAGE-VERSION)$'
        pass_filenames: false
